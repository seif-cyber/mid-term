  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1e; --card:#141a2d; --card2:#1a2137; --text:#e9edf6; --muted:#97a3bc; --line:#242c45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
    --ico-s:45%; --ico-l:24%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1e; --card:#141a2d; --card2:#1a2137; --text:#e9edf6; --muted:#97a3bc; --line:#242c45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6);
  --ico-s:45%; --ico-l:24%; color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.top{
  background:linear-gradient(135deg,#312e81 0%,#6d28d9 50%,#db2777 130%);
  color:#fff;padding:calc(var(--safe-t) + 16px) 18px 54px;border-radius:0 0 28px 28px;
}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.85}
.pill{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
main{padding:0 14px calc(92px + var(--safe-b));margin-top:-38px}
.view{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 small{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:16px 6px 8px;letter-spacing:.3px}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));
}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand)}
:root[data-theme="dark"] .tabbar button.on{color:#8b93ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button.on{color:#8b93ff}}

/* ---------- day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dchip{
  flex:1 0 58px;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);position:relative
}
.dchip b{font-size:12.5px}
.dchip span{font-size:17px;font-weight:800;line-height:1.2}
.dchip i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.dchip i.p{background:var(--warn)} .dchip i.g{background:var(--ok)}
.dchip.on{background:var(--brand);color:#fff;border-color:transparent}
.dchip.today:not(.on){border-color:var(--brand)}
.dchip.on i.p,.dchip.on i.g{box-shadow:0 0 0 1.5px #fff}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:14px}
.ring{width:92px;height:92px;flex:none}
.ring .rt{fill:none;stroke:var(--line);stroke-width:8}
.ring .rf{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .rtx{font-size:17px;font-weight:800;fill:var(--text)}
.prog .meta{flex:1;min-width:0}
.prog .meta b{font-size:17px;display:block}
.prog .meta small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

/* ---------- now card ---------- */
.now{background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff;border:0}
.now .lbl{font-size:12px;opacity:.85;font-weight:700}
.now .big{font-size:19px;font-weight:800;margin:2px 0}
.now .sub{font-size:13px;opacity:.92}
.bar{height:7px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.now.sleepy{background:linear-gradient(135deg,#1e1b4b,#4338ca)}

/* ---------- tasks ---------- */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:12px}
.task:last-child{border-bottom:0}
.task .chk{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;
  color:transparent;font-size:15px;font-weight:900;transition:all .15s;background:var(--card)
}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .ico,.ico{
  width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:20px;
  background:hsl(var(--h) var(--ico-s) var(--ico-l))
}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14.5px;font-weight:700}
.task .tx small{color:var(--muted);font-size:12px}
.task.done .tx b{text-decoration:line-through;color:var(--muted)}
.task.now{background:color-mix(in srgb,var(--brand) 9%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent);padding-inline:8px;margin-block:2px}
.task .live{font-size:11px;font-weight:800;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;flex:none}
.sleeprow{display:flex;align-items:center;gap:11px;padding:11px 4px 2px}
.sleeprow .ico{background:hsl(250 45% 28%);color:#fff}
.sleeprow b{display:block;font-size:14.5px}
.sleeprow small{color:var(--muted);font-size:12px}

/* ---------- lectures ---------- */
.lect{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;position:relative;border-inline-start:4px solid var(--brand)}
.lect.now{box-shadow:0 0 0 2px var(--brand)}
.lect .tm{min-width:62px;text-align:center;font-size:12px;font-weight:800;color:var(--brand)}
.lect .tm small{display:block;color:var(--muted);font-weight:600}
.lect h3{margin:0;font-size:14.5px;font-weight:800;direction:ltr;text-align:right}
.lect p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);margin-inline-start:6px;vertical-align:2px;direction:rtl;display:inline-block}
.badge.sec2{background:color-mix(in srgb,var(--ok) 16%,transparent);color:#059669}
.badge.re{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#b45309}
.offcard{text-align:center;padding:22px 14px}
.offcard .big{font-size:42px}
.offcard p{margin:6px 0 0;color:var(--muted)}

/* ---------- stats ---------- */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-size:12px;font-weight:700}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.5}
.chart text{font-size:10.5px;fill:var(--muted);text-anchor:middle;font-family:inherit}
.chart text.v{font-weight:700;fill:var(--text)}
.chart .bg{fill:var(--line)}
.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);display:block;min-width:0}
.heat i.l1{background:#c7d2fe} .heat i.l2{background:#818cf8} .heat i.l3{background:#4f46e5} .heat i.l4{background:#10b981}
.heat i.x{opacity:0} .heat i.pre{opacity:.35}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0}
.crow .ico{width:34px;height:34px;font-size:17px;border-radius:11px}
.crow .mid{flex:1;min-width:0}
.crow .mid .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.crow .mid .t span{color:var(--muted);font-weight:600;font-size:12px}
.track{height:8px;background:var(--line);border-radius:99px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 70% 52%)}
.ins{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ins:last-child{border-bottom:0}
.ins span:first-child{font-size:20px}

/* ---------- forms ---------- */
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=time],input[type=date],select{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;
}
.q{display:flex;gap:6px;margin:6px 0 12px}
.q button{flex:1;font-size:24px;padding:6px 0;border-radius:12px;background:var(--card2);border:2px solid transparent;filter:grayscale(.8);opacity:.7}
.q button.on{border-color:var(--brand);filter:none;opacity:1}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;text-align:center}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn+.btn{margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn+.btn{margin:0}
.hrs{font-size:34px;font-weight:800;text-align:center;margin:4px 0}
.hrs small{font-size:14px;color:var(--muted);font-weight:700}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 small{color:var(--muted)}
.x{color:var(--bad);font-weight:800;padding:6px 10px}
.steps{margin:0;padding-inline-start:20px}
.steps li{margin:6px 0}
.rule{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .e{font-size:22px}
.rule b{display:block}
.rule p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ok{color:var(--ok);font-weight:800}

/* ---------- toast ---------- */
.toast{
  position:fixed;inset-inline:0;bottom:calc(86px + var(--safe-b));display:flex;justify-content:center;z-index:50;pointer-events:none;
  opacity:0;transform:translateY(10px);transition:all .25s
}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast div{background:#0f172a;color:#fff;border-radius:14px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;max-width:90vw}
.toast button{color:#93c5fd;font-weight:800}

@media print{
  .tabbar,.toast{display:none!important}
  body{background:#fff}
  main{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- midterm additions ---------- */
.hero{background:linear-gradient(135deg,#1e1b4b,#6d28d9 60%,#be185d);color:#fff;border:0;text-align:center;padding:18px 14px}
.hero .lbl{font-size:12px;opacity:.85;font-weight:700}
.hero .cname{font-size:18px;font-weight:800;margin:2px 0 6px}

.hero .cd b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.hero .cd small{font-size:11px;opacity:.85}
.hero .sub{font-size:13px;opacity:.92;margin-top:6px}
.task.busy{cursor:default;opacity:.75}
.task.busy .ico{background:var(--card2);border:1px dashed var(--line)}
.task.busy .tx b{font-weight:600;color:var(--muted)}
.task.exam{background:linear-gradient(135deg,color-mix(in srgb,#ef4444 14%,transparent),color-mix(in srgb,#f59e0b 14%,transparent));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#ef4444 55%,transparent);padding-inline:8px;margin-block:4px;cursor:default}
.task.exam .tx b{color:var(--text)}
.tag{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;flex:none}
.tag.e{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#b45309}
.tag.p{background:color-mix(in srgb,#3b82f6 18%,transparent);color:#1d4ed8}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#059669}
.tag.live{background:#ef4444;color:#fff}
.dchip .ex{font-size:11px;line-height:1;height:7px;margin-top:3px}
.exc{display:flex;flex-direction:column;gap:8px}
.exc .head{display:flex;align-items:center;gap:11px}
.exc .head .tx{flex:1;min-width:0}
.exc .head b{font-size:15.5px;display:block}
.exc .head small{color:var(--muted)}
.exc .meta{display:flex;flex-wrap:wrap;gap:6px}
.chip.hot{background:color-mix(in srgb,#ef4444 12%,transparent);border-color:transparent;color:#dc2626}
.pace{display:flex;align-items:center;gap:12px}
.pace .big{font-size:30px;font-weight:800;line-height:1}
.pace.good .big{color:var(--ok)} .pace.bad .big{color:var(--bad)}
.done-banner{text-align:center}
.done-banner .big{font-size:44px}
.dchip em{font-style:normal}

.top h1{font-size:18px}
.crow .mid .t{gap:6px;flex-wrap:wrap}
.crow .mid .t span{white-space:nowrap}

.chip.lok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#059669;border-color:transparent}
.chip.lpart{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#b45309;border-color:transparent}

.lecs{gap:4px!important;flex-wrap:nowrap!important}.lecs .chip{padding:2px 0;font-size:11.5px;flex:1;text-align:center}

    { c: 'sad', d: '2026-11-02', s: '11:50', e: '12:50', k: 'e' },

<script>
/* ============================================================

(() => {
'use strict';

const M = window.MID, C = M.COURSES;

/* ---------- helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => dkey(new Date());
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const at = (k, t) => { const d = parseKey(k); const [h, m] = t.split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
const fmt = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'م' : 'ص'; h = h % 12 || 12; return `${pad(h)}:${pad(m)} ${ap}`; };
const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h} س ${r} د` : h ? `${h} س` : `${r} د`; };
const hrs = m => (m / 60).toFixed(1).replace(/\.0$/, '');
const pct = x => Math.round(x * 100);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mm = b => mins(b.e) - mins(b.s);
const tracked = b => b.k === 'study' || b.k === 'gym';
const blocks = k => M.days[k] || [];
const planKeys = (() => { const a = []; for (let d = parseKey(M.first); dkey(d) <= M.last; d = addDays(d, 1)) a.push(dkey(d)); return a; })();
const clamp = k => k < M.first ? M.first : k > M.last ? M.last : k;
const bkey = (k, b) => `${k}|${b.s}`;
const shortDM = d => { try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }).format(d); } catch (e) { return `${d.getDate()}/${d.getMonth() + 1}`; } };
const longDate = d => { try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(d); } catch (e) { return dkey(d); } };
const greeting = () => `${new Date().getHours() < 12 ? 'صباح الخير' : 'مساء الخير'} يا باشمهندس ${M.owner} 👋`;
const pillDays = x => { const d = x.st - new Date(), dd = Math.floor(d / 864e5), hh = Math.max(0, Math.floor(d % 864e5 / 36e5)); return dd > 0 ? `🎯 ${dd} يوم` : `🎯 ${hh} س`; };
const lec = b => { if (!b.L || !b.L.length) return ''; const x = b.L[0], z = b.L[b.L.length - 1]; const w = b.v ? 'فيديو' : (x === z ? 'محاضرة' : 'محاضرات'); return ` — ${w} ${x === z ? x : `${x}–${z}`}`; };
const kindTxt = k => k === 'e' ? 'إلكتروني · 20 دقيقة' : 'ورقي · ساعة';

/* ---------- state ---------- */
const defaults = () => ({ v: 1, done: {}, settings: { theme: 'auto' } });
let S = (() => {
  let s = defaults();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = Object.assign(s, JSON.parse(raw)); } catch (e) { /* ignore */ }
  s.settings = Object.assign({ theme: 'auto' }, s.settings || {}); s.done = s.done || {};
  return s;
})();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; } catch (e) { toast('⚠️ تعذّر الحفظ على الجهاز'); return false; } }

/* ---------- toast ---------- */
let toastT;
function toast(msg, btn) {
  const el = $('#toast'), b = $('#toastBtn');
  $('#toastMsg').textContent = msg;
  if (btn) { b.hidden = false; b.textContent = btn.label; b.onclick = () => { btn.fn(); el.classList.remove('show'); }; }
  else { b.hidden = true; b.onclick = null; }
  el.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), btn ? 9000 : 2400);
}

/* ---------- calculations ---------- */
function dayStat(k) {
  const bl = blocks(k).filter(tracked);
  let done = 0, sp = 0, sd = 0;
  for (const b of bl) {
    const d = !!S.done[bkey(k, b)];
    if (d) done++;
    if (b.k === 'study') { sp += mm(b); if (d) sd += mm(b); }
  }
  const gym = blocks(k).find(b => b.k === 'gym');
  return { total: bl.length, done, p: bl.length ? done / bl.length : 0, sp, sd, gym, gymDone: gym ? !!S.done[bkey(k, gym)] : false };
}
function lastCounted() { const t = todayKey(); return t < M.first ? null : (t > M.last ? M.last : t); }
function streaks() {
  const lc = lastCounted(); if (!lc) return { cur: 0, best: 0 };
  let best = 0, run = 0;
  for (const k of planKeys) { if (k > lc) break; const s = dayStat(k); if (s.total && s.p >= PASS) { run++; best = Math.max(best, run); } else run = 0; }
  let cur = 0;
  for (let i = planKeys.indexOf(lc); i >= 0; i--) {
    const k = planKeys[i], s = dayStat(k);
    if (s.total && s.p >= PASS) cur++;
    else if (k === todayKey()) continue;
    else break;
  }
  return { cur, best };
}
function courseStats() {
  const now = new Date(), out = {};
  for (const c of Object.keys(C)) out[c] = { plan: 0, done: 0, planNow: 0, doneNow: 0, vp: 0, vd: 0 };
  for (const k of planKeys) for (const b of blocks(k)) {
    if (b.k !== 'study') continue;
    const o = out[b.c], d = !!S.done[bkey(k, b)], over = at(k, b.e) <= now;
    o.plan += mm(b); if (d) o.done += mm(b);
    if (b.v) { o.vp += mm(b); if (d) o.vd += mm(b); }
    if (over) { o.planNow += mm(b); if (d) o.doneNow += mm(b); }
  }
  return out;
}
const examsFull = () => M.EXAMS.map(x => ({ ...x, st: at(x.d, x.s), en: at(x.d, x.e) }));
function lectureCov(c) {
  const r = {}; for (let n = 1; n <= 6; n++) r[n] = { t: 0, d: 0 };
  for (const k of planKeys) for (const b of blocks(k)) if (b.k === 'study' && b.c === c && b.p) for (const n of b.L) { r[n].t++; if (S.done[bkey(k, b)]) r[n].d++; }
  return r;
}
function nextSession(c) {
  const now = new Date();
  for (const k of planKeys) for (const b of blocks(k)) if (b.k === 'study' && b.c === c && !S.done[bkey(k, b)] && at(k, b.e) > now) return { k, b };
  return null;
}

/* ---------- svg ---------- */
function ring(p) {
  const r = 34, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 80 80" role="img" aria-label="${pct(p)}%">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
    <circle cx="40" cy="40" r="${r}" class="rt"/>
    <circle cx="40" cy="40" r="${r}" class="rf" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p)).toFixed(2)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="45" text-anchor="middle" class="rtx">${pct(p)}%</text></svg>`;
}
function barChart(vals, o) {
  const n = vals.length, W = 320, H = o.h || 150, pt = o.vl ? 16 : 8, pb = o.labels ? 22 : 8, ph = H - pt - pb;
  const gap = n > 14 ? 2 : 6, bw = (W - gap * (n + 1)) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.aria || 'رسم بياني')}">`;
  if (o.line != null) { const y = pt + ph * (1 - o.line); s += `<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/>`; }
  vals.forEach((v, i) => {
    const x = W - (i + 1) * bw - (i + 1) * gap, vv = v == null ? 0 : Math.min(1, Math.max(0, v));
    const bh = Math.max(v == null ? 0 : 3, ph * vv), r = Math.min(6, bw / 2).toFixed(1);
    s += `<rect x="${x.toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${ph}" rx="${r}" class="bg" opacity=".45"/>`;
    if (v != null) s += `<rect x="${x.toFixed(1)}" y="${(pt + ph - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${r}" fill="${o.color ? o.color(vv) : '#7c3aed'}"/>`;
    if (o.vl && o.vl[i] != null) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(pt + ph - bh - 4).toFixed(1)}" class="v">${esc(o.vl[i])}</text>`;
    if (o.labels && o.labels[i]) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}">${esc(o.labels[i])}</text>`;
  });
  return s + '</svg>';
}

/* ---------- ICS ---------- */
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const fold = line => { let out = '', i = 0; while (line.length - i > 60) { out += line.slice(i, i + 60) + '\r\n '; i += 60; } return out + line.slice(i); };
function buildICS(mode) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Midterm//AR//', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ميدتيرم'];
  const n = new Date(), stamp = `${n.getUTCFullYear()}${pad(n.getUTCMonth() + 1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}${pad(n.getUTCSeconds())}Z`;
  const T = (k, t) => `${k.replace(/-/g, '')}T${t.replace(':', '')}00`;
  const ev = (uid, title, k, s, e, desc, alarms) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@midterm`, `DTSTAMP:${stamp}`, `DTSTART:${T(k, s)}`, `DTEND:${T(k, e)}`, `SUMMARY:${icsEsc(title)}`);
    if (desc) L.push(`DESCRIPTION:${icsEsc(desc)}`);
    for (const a of alarms) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:${a}`, 'END:VALARM');
    L.push('END:VEVENT');
  };
  for (const x of M.EXAMS) ev(`exam-${x.c}`, `🎯 امتحان ${C[x.c].n}`, x.d, x.s, x.e, `${C[x.c].ar} — ${kindTxt(x.k)}`, ['-P1D', '-PT90M']);
  if (mode === 'plan') for (const k of planKeys) for (const b of blocks(k)) {
    if (b.k === 'study') ev(`s-${k}-${b.s}`, `${C[b.c].i} ${C[b.c].n}`, k, b.s, b.e, b.f, ['-PT5M']);
    else if (b.k === 'gym') ev(`g-${k}-${b.s}`, '🏋️ تمرين الجيم', k, b.s, b.e, '', ['-PT5M']);
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}
async function shareOrDownload(name, mime, text) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
}
function importData(text) {
  try {
    const p = JSON.parse(text); if (!p || typeof p !== 'object' || !p.done) throw 0;
    S = Object.assign(defaults(), p); S.settings = Object.assign({ theme: 'auto' }, p.settings || {});
    save(); applyTheme(); render(); toast('✅ تم استيراد البيانات');
  } catch (e) { toast('⚠️ الملف مش صالح'); }
}

function applyTheme() {
  const t = S.settings.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#1e1b4b' : '#6d28d9');
}
const VIEWS = ['today', 'exams', 'stats', 'more'];
function render() {
  ({ today: renderToday, exams: renderExams, stats: renderStats, more: renderMore })[ui.tab]();
  VIEWS.forEach(t => { $('#v-' + t).hidden = t !== ui.tab; });
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  if (ui.tab !== 'today') { const live = examsFull().find(x => new Date() >= x.st && new Date() < x.en), nx = examsFull().find(x => x.st > new Date());
    $('#streakPill').textContent = live ? '🎯 الآن' : nx ? pillDays(nx) : '🎉 خلصت'; }
}
const go = tab => { ui.tab = tab; render(); window.scrollTo({ top: 0 }); };

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  switch (el.dataset.act) {
    case 'tab': go(el.dataset.tab); break;
    case 'day': ui.day = el.dataset.day; renderToday.sc = false; renderToday(); break;
    case 'toggle': toggle(el.dataset.k, el.dataset.s); break;
    case 'theme': S.settings.theme = el.dataset.v; save(); applyTheme(); renderMore(); break;
    case 'ics': { const ok = await shareOrDownload(el.dataset.mode === 'plan' ? 'midterm-plan.ics' : 'midterm-exams.ics', 'text/calendar', buildICS(el.dataset.mode)); if (ok) toast('📅 افتح الملف واختار «إضافة للتقويم»'); break; }
    case 'export': await shareOrDownload(`midterm-backup-${todayKey()}.json`, 'application/json', JSON.stringify(S, null, 1)); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': if (confirm('متأكد؟ هيتمسح كل التتبع نهائيًا.')) { S = defaults(); save(); applyTheme(); ui.day = clamp(todayKey()); render(); toast('تم المسح'); } break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; renderMore(); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile' && el.files[0]) { const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(el.files[0]); el.value = ''; }
});

function refreshClock() {
  if (todayKey() !== ui.lastToday) { const follow = ui.day === clamp(ui.lastToday); ui.lastToday = todayKey(); if (follow) ui.day = clamp(ui.lastToday); render(); return; }
  if (!document.hidden && ui.tab === 'today') renderToday();
}
setInterval(refreshClock, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClock(); });
if (matchMedia('(prefers-color-scheme: dark)').addEventListener) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.tab === 'more') renderMore(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('🎉 اتثبّت التطبيق'); });

if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('🆕 فيه تحديث جديد', { label: 'حدّث', fn: () => nw.postMessage({ type: 'SKIP_WAITING' }) }); });
      });
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloading) return; reloading = true; location.reload(); });
  });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

applyTheme();
render();
window.__app = { get S() { return S; }, ui, dayStat, streaks, courseStats, buildICS, planKeys };
})();

</script>
</body>
</html>
